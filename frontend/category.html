<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vídeos - Loom Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #1a2332;
            line-height: 1.6;
        }

        .hero {
            background: #171a22;
            padding: 1rem 2rem;
            border-bottom: 3px solid #e8590c;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #e8590c, #aa502a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
        }

        .logo-text h1 {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
        }

        .logo-text h1 span {
            color: #e8590c;
        }

        .back-btn {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: #e8590c;
        }

        .category-banner {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 2rem;
        }

        .category-banner h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a2332;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .category-banner h2 i {
            color: #e8590c;
        }

        .category-banner p {
            color: #5a6b85;
            margin-top: 0.2rem;
        }

        .search-section {
            max-width: 1400px;
            margin: 0.8rem auto 0;
            padding: 0 2rem;
        }

        .search-wrapper {
            background: #fff;
            border-radius: 14px;
            padding: 0.4rem 1rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #e8edf4;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .search-wrapper i {
            color: #8a9bb5;
        }

        .search-wrapper input {
            flex: 1;
            padding: 0.6rem 0;
            border: none;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: #1a2332;
        }

        .search-wrapper input:focus {
            outline: none;
        }

        .videos-container {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 2rem 2rem;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.2rem;
        }

        .video-card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #e8edf4;
            cursor: pointer;
            transition: 0.3s;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(232, 89, 12, 0.08);
            border-color: rgba(232, 89, 12, 0.2);
        }

        .video-card .thumbnail {
            background: #0a1628;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .video-card .thumbnail iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        .video-card .card-info {
            padding: 0.6rem 0.8rem 0.8rem;
        }

        .video-card .card-info .title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a2332;
            line-height: 1.3;
        }

        .video-card .card-info .subcat {
            font-size: 0.75rem;
            color: #8a9bb5;
            margin-top: 0.2rem;
        }

        .video-card .card-info .desc {
            font-size: 0.8rem;
            color: #5a6b85;
            margin-top: 0.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            background: #fff;
            border-radius: 16px;
            color: #8a9bb5;
            border: 1px solid #e8edf4;
            grid-column: 1/-1;
        }

        .empty-state i {
            font-size: 2.5rem;
            opacity: 0.3;
            color: #e8590c;
            margin-bottom: 0.5rem;
        }

        .loading-grid {
            text-align: center;
            padding: 3rem;
            color: #e8590c;
            grid-column: 1/-1;
        }

        .pagination-wrapper {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 2rem 2rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .pagination button {
            background: #fff;
            border: 1px solid #e8edf4;
            padding: 0.4rem 0.9rem;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1a2332;
            font-family: 'Inter', sans-serif;
        }

        .pagination button:hover:not(:disabled) {
            background: #e8590c;
            color: #fff;
            border-color: #e8590c;
        }

        .pagination button.active {
            background: #e8590c;
            color: #fff;
            border-color: #e8590c;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination-info {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.8rem;
            color: #8a9bb5;
        }

        @media (max-width: 768px) {
            .hero {
                padding: 0.8rem 1rem;
            }
            .category-banner {
                padding: 0 1rem;
            }
            .category-banner h2 {
                font-size: 1.4rem;
            }
            .search-section {
                padding: 0 1rem;
            }
            .videos-container {
                padding: 0 1rem 1rem;
            }
            .videos-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="hero">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-play"></i></div>
            <div class="logo-text">
                <h1>Loom <span>Library</span></h1>
            </div>
        </div>
        <button class="back-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>
    </header>

    <!-- BANNER -->
    <div class="category-banner">
        <h2 id="categoryTitle"><i class="fas fa-tag"></i> Carregando...</h2>
        <p id="categoryDesc">Vídeos desta categoria</p>
    </div>

    <!-- SEARCH -->
    <div class="search-section">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar nesta categoria...">
        </div>
    </div>

    <!-- GRID -->
    <div class="videos-container">
        <div id="videosGrid" class="videos-grid">
            <div class="loading-grid"><i class="fas fa-spinner fa-pulse"></i> Carregando vídeos...</div>
        </div>
    </div>

    <!-- PAGINATION -->
    <div class="pagination-wrapper">
        <div id="paginationContainer" class="pagination"></div>
        <div id="paginationInfo" class="pagination-info"></div>
    </div>

    <script>
        (function() {
            const API_URL = 'https://biblioteca-loom.onrender.com/api';
            const VIDEOS_PER_PAGE = 12;

            let currentPage = 1;
            let totalPages = 1;
            let totalVideos = 0;
            let currentCategory = '';

            function getCategoryFromUrl() {
                var params = new URLSearchParams(window.location.search);
                return params.get('tag') || '';
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function getLoomEmbedUrl(loomUrl) {
                var match = loomUrl.trim().match(/loom\.com\/share\/([a-zA-Z0-9_-]+)/);
                return match ? 'https://www.loom.com/embed/' + match[1] : loomUrl;
            }

            function openVideoPlayer(videoId) {
                window.location.href = 'player.html?id=' + encodeURIComponent(videoId);
            }

            function renderVideos(videos) {
                var grid = document.getElementById('videosGrid');
                if (!videos || videos.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-video"></i>
                            <p>Nenhum vídeo encontrado.</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = '';
                videos.forEach(function(v) {
                    var embedUrl = getLoomEmbedUrl(v.link);
                    var card = document.createElement('div');
                    card.className = 'video-card';
                    card.setAttribute('data-id', v.id);
                    card.innerHTML = `
                        <div class="thumbnail">
                            <iframe src="${embedUrl}" frameborder="0" allow="fullscreen" allowfullscreen loading="lazy"></iframe>
                        </div>
                        <div class="card-info">
                            <div class="title">${escapeHtml(v.title)}</div>
                            <div class="subcat"><i class="fas fa-tag"></i> ${escapeHtml(v.subcategory)}</div>
                            <div class="desc">${escapeHtml(v.description || '')}</div>
                        </div>
                    `;
                    card.addEventListener('click', function() {
                        openVideoPlayer(this.getAttribute('data-id'));
                    });
                    grid.appendChild(card);
                });
            }

            function renderPagination() {
                var container = document.getElementById('paginationContainer');
                var info = document.getElementById('paginationInfo');

                if (totalPages <= 1) {
                    container.innerHTML = '';
                    info.textContent = totalVideos + ' vídeo' + (totalVideos !== 1 ? 's' : '');
                    return;
                }

                var html = '';
                html += '<button onclick="window.goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '><i class="fas fa-chevron-left"></i></button>';

                for (var i = 1; i <= totalPages; i++) {
                    if (i === currentPage) {
                        html += '<button class="active">' + i + '</button>';
                    } else if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
                        html += '<button onclick="window.goToPage(' + i + ')">' + i + '</button>';
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        html += '<button disabled>...</button>';
                    }
                }

                html += '<button onclick="window.goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '><i class="fas fa-chevron-right"></i></button>';

                container.innerHTML = html;
                info.textContent = 'Página ' + currentPage + ' de ' + totalPages + ' • ' + totalVideos + ' vídeos';
            }

            window.goToPage = function(page) {
                if (page < 1 || page > totalPages) return;
                loadVideos(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            async function loadVideos(page) {
                page = page || 1;
                var grid = document.getElementById('videosGrid');
                grid.innerHTML = '<div class="loading-grid"><i class="fas fa-spinner fa-pulse"></i> Carregando...</div>';

                var searchTerm = document.getElementById('searchInput').value;
                var url = API_URL + '/videos?page=' + page + '&limit=' + VIDEOS_PER_PAGE;
                if (currentCategory) url += '&category=' + encodeURIComponent(currentCategory);
                if (searchTerm) url += '&search=' + encodeURIComponent(searchTerm);

                try {
                    var response = await fetch(url);
                    if (!response.ok) throw new Error('Erro');
                    var result = await response.json();
                    var videos = result.data || result;
                    totalVideos = result.total || videos.length;
                    totalPages = result.totalPages || Math.ceil(totalVideos / VIDEOS_PER_PAGE);
                    currentPage = page;

                    renderVideos(videos);
                    renderPagination();
                } catch (error) {
                    console.error(error);
                    grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Erro ao carregar.</p></div>';
                }
            }

            // Inicializa
            currentCategory = getCategoryFromUrl();
            if (currentCategory) {
                document.getElementById('categoryTitle').innerHTML = '<i class="fas fa-tag"></i> ' + escapeHtml(currentCategory);
                document.getElementById('categoryDesc').textContent = 'Vídeos da categoria ' + currentCategory;
            } else {
                document.getElementById('categoryTitle').innerHTML = '<i class="fas fa-tag"></i> Todos os vídeos';
                document.getElementById('categoryDesc').textContent = 'Navegue por todos os vídeos';
            }

            var searchTimeout;
            document.getElementById('searchInput').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(function() {
                    loadVideos(1);
                }, 400);
            });

            loadVideos(1);

            window.openVideoPlayer = openVideoPlayer;
            window.goToPage = goToPage;

        })();
    </script>

</body>
</html>
