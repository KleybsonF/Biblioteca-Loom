<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vídeos — Central de Conteúdos - SGP</title>

    <noscript><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&amp;display=swap"></noscript>
    
    <!-- Space Grotesk via Google Fonts -->

    <!-- Tailwind CDN & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 600: '#e8641b' },
              signal: '#e8641b',
              ink: '#090909',
              charcoal: '#2b2b2b',
              smoke: '#5f5f5f',
              fog: '#b2b2b2',
              mist: '#dedede',
              cloud: '#f1f5f9',
              paper: '#f8fafc',
            },
            fontFamily: {
              sans: ['"Space Grotesk"', '"Arial"', 'sans-serif'],

          }

    </script>
    <style>
      .container-shell {
        width: min(1180px, 100vw - 2.5rem);
        margin-inline: auto;
      }
      .section-space {
        padding-block: clamp(3rem, 6vw, 7rem);
      }
    </style>
    
    <link rel="stylesheet" href="css/shared.css">
    <style>
        .category-banner {
            max-width: 1400px;
            margin: 2rem auto 0;
            padding: 0 2rem;
        }

        .category-banner h2 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-family: var(--font-heading);
            letter-spacing: -0.5px;
        }

        .category-banner h2 i { color: var(--color-brand); }
        .category-banner p { color: var(--text-muted); margin-top: 0.5rem; font-size: 1.1rem; }

        .search-section-inline {
            max-width: 1400px;
            margin: 2rem auto 0;
            padding: 0 2rem;
        }

        .search-wrapper-inline {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 0.6rem 1.5rem;
            box-shadow: var(--shadow-base);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        .search-wrapper-inline:focus-within {
            border-color: var(--color-brand);
            box-shadow: 0 0 0 4px var(--color-brand-muted);
            background: var(--bg-surface-hover);
        }

        .search-wrapper-inline i { color: var(--color-brand); font-size: 1.1rem; }

        .search-wrapper-inline input {
            flex: 1;
            padding: 0.8rem 0;
            border: none;
            font-size: 1rem;
            font-family: var(--font-body);
            background: transparent;
            color: var(--text-main);
            padding-left: 0;
        }
        
        .search-wrapper-inline input::placeholder {
            color: var(--text-muted);
        }

        .search-wrapper-inline input:focus { outline: none; }

        @media (max-width: 768px) {
            .category-banner { padding: 0 1rem; margin-top: 1.5rem; }
            .category-banner h2 { font-size: 1.8rem; }
            .search-section-inline { padding: 0 1rem; margin-top: 1.5rem; }
        }


        /* Ajuste mobile das thumbs: mesmo padrão visual do index */
        @media (max-width: 768px) {
            .category-page .videos-container {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                padding-left: 1.2rem;
                padding-right: 1.2rem;
            }

            .category-page .videos-grid {
                width: 100%;
                max-width: 100%;
                grid-template-columns: minmax(0, 1fr);
                gap: 1.5rem;
            }

            .category-page .videos-grid .video-card {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                height: auto;
                min-height: 0;
                max-height: none;
                overflow: hidden;
            }

            .category-page .videos-grid .video-thumbnail {
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
                flex-shrink: 0;
            }

            .category-page .videos-grid .video-thumbnail img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .category-page .videos-grid .card-content {
                min-width: 0;
                padding: 1.2rem;
                box-sizing: border-box;
            }
        }
    </style>

<style>
/* ============================================================
   CATEGORY — MOBILE: mesmo comportamento visual dos cards do index
   ============================================================ */
@media (max-width: 768px) {
    html, body {
        max-width: 100%;
        overflow-x: hidden;
    }

    .category-page .videos-container {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 0 1.2rem;
        margin-top: 2rem;
    }

    .category-page .videos-grid {
        width: 100%;
        max-width: 100%;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        justify-items: center;
        align-items: start;
    }

    .category-page .videos-grid .video-card {
        width: calc(100% - 2.15rem);
        max-width: none;
        min-width: 0;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: hidden;
        box-sizing: border-box;
    }

    .category-page .videos-grid .video-thumbnail,
    .category-page .video-thumbnail.dynamic-thumb {
        width: 100%;
        height: auto;
        min-height: 0;
        aspect-ratio: 16 / 9;
        flex: 0 0 auto;
        box-sizing: border-box;
    }

    .category-page .videos-grid .video-thumbnail img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
    }

    .category-page .videos-grid .card-content {
        width: 100%;
        min-width: 0;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        flex: none !important;
        padding: 1rem;
        box-sizing: border-box;
        overflow: visible;
    }

    .category-page .videos-grid .video-title {
        min-width: 0;
        width: 100%;
        white-space: normal;
        overflow: visible;
        overflow-wrap: anywhere;
        word-break: normal;
        display: block;
        -webkit-line-clamp: unset;
    }

    .category-page .videos-grid .subcat,
    .category-page .videos-grid .description {
        min-width: 0;
        width: 100%;
        overflow-wrap: anywhere;
    }

    .category-page .videos-grid .description {
        flex: none !important;
    }

    .category-page .dynamic-thumb .thumb-title-container {
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
    }

    .category-page .dynamic-thumb .thumb-title {
        max-width: 100%;
        overflow-wrap: anywhere;
    }
}
</style>

</head>
<body class="category-page">

    <!-- HEADER -->
    <header class="sticky top-0 z-20" data-topbar="">
      <div class="border-b border-white/10 bg-black text-white transition-all duration-300">
        <div class="max-w-[1400px] w-full mx-auto px-8 flex items-center justify-between gap-4 transition-all duration-300 min-h-20 lg:min-h-24 py-4 lg:py-0" data-topbar-inner="">
          <a href="/" class="flex items-center" aria-label="TSMX">
            <img src="https://tsmxmail.sgp.net.br/r2/logo/logo_sombra.png" alt="TSMX Tecnologia Viva" data-topbar-logo="true" loading="lazy" decoding="async" fetchpriority="auto" width="240" height="52" class="w-auto transition-all duration-300 h-[2.3rem] sm:h-[2.59rem]">
          </a>
          <div class="flex items-center gap-6">
            <nav aria-label="Navegação principal" class="hidden flex-wrap items-center gap-x-6 gap-y-3 text-sm text-white/70 lg:flex md:text-[0.95rem]">
              <a href="https://wiki.sgp.net.br" target="_blank" rel="noreferrer" class="transition-colors duration-200 hover:text-white" style="font-family: var(--font-body);">Wiki</a>
            </nav>

            <a href="https://wa.me/558431137050" target="_blank" rel="noopener noreferrer" class="hidden min-h-11 items-center justify-center rounded-full bg-signal px-4 text-sm font-semibold text-white transition-transform duration-200 hover:-translate-y-0.5 sm:min-h-12 sm:px-5 lg:inline-flex" style="font-family: var(--font-body);">
              Fale com o time
            </a>
          </div>
        </div>
      </div>

      <script type="module">
        const o = document.querySelector("[data-topbar-inner]");
        const t = document.querySelector("[data-topbar-logo]");

        function e() {
          const s = window.scrollY > 10;

          o && (
            o.classList.toggle("py-4", !s),
            o.classList.toggle("lg:py-0", !s),
            o.classList.toggle("py-2", s)
          );

          t && (
            t.classList.toggle("h-[2.3rem]", !s),
            t.classList.toggle("sm:h-[2.59rem]", !s),
            t.classList.toggle("h-[1.75rem]", s),
            t.classList.toggle("sm:h-[1.9rem]", s)
          );
        }

        window.addEventListener("scroll", e, { passive: true });
        e();
      </script>
    </header>

    <!-- BANNER -->
    <div class="category-banner">
        <h2 id="categoryTitle"><i class="fas fa-tag"></i> Carregando...</h2>
        <p id="categoryDesc">Vídeos desta categoria</p>
    </div>

    <!-- SEARCH -->
    <div class="search-section-inline">
        <div class="search-wrapper-inline">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar nesta categoria..." autocomplete="off">
        </div>
    </div>

    <!-- GRID -->
    <div class="videos-container">
        <div id="videosGrid" class="videos-grid">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando vídeos...</div>
        </div>
    </div>

    <!-- PAGINATION -->
    <div class="pagination-wrapper">
        <div id="paginationContainer"></div>
        <div id="paginationInfo" class="pagination-info"></div>
    </div>

    <!-- FOOTER -->
    <footer id="contato" class="relative overflow-hidden bg-[#060606] text-white border-t border-white/10">
      <div class="max-w-[1400px] mx-auto px-8 py-8 relative z-10 flex flex-col sm:flex-row items-center justify-between gap-6">
        <a href="/" aria-label="TSMX">
            <img src="https://tsmxmail.sgp.net.br/r2/logo/logo_sombra.png" alt="TSMX Tecnologia Viva" loading="lazy" decoding="async" fetchpriority="auto" width="240" height="52" class="h-8 w-auto">
        </a>
        <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-6 text-[0.85rem] text-white/50" style="font-family: var(--font-body);">
          <p>Todos os direitos reservados.</p>
          <p>TSMX. Ecossistema de tecnologia para provedores.</p>
        </div>
      </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
    (function() {
        const { escapeHtml, buildThumbnailHtml, buildPagination, apiGet } = LoomLib;

        const VIDEOS_PER_PAGE = 10;
        let currentPage     = 1;
        let totalPages      = 1;
        let totalVideos     = 0;
        let currentCategory = '';

        function getCategoryFromUrl() {
            return new URLSearchParams(window.location.search).get('tag') || '';
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videosGrid');

            if (!videos || videos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-video"></i>
                        <p>Nenhum vídeo encontrado.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = '';
            for (const v of videos) {
                const card = document.createElement('div');
                card.className = 'video-card group';
                card.setAttribute('data-id', v.id);
                card.innerHTML = buildThumbnailHtml(v.link, v.title) + `
                    <div class="card-content">
                        <div class="video-title">${escapeHtml(v.title)}</div>
                        <div class="subcat"><i class="fas fa-tag"></i> ${escapeHtml(v.subcategory)}</div>
                        <div class="description">${escapeHtml(v.description || '')}</div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = 'player.html?id=' + encodeURIComponent(v.id);
                });
                grid.appendChild(card);
            }
        }

        function renderPagination() {
            const container = document.getElementById('paginationContainer');
            const info      = document.getElementById('paginationInfo');

            container.innerHTML = '';
            container.appendChild(buildPagination(currentPage, totalPages, (page) => {
                loadVideos(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }));
            info.textContent = `Página ${currentPage} de ${totalPages} • ${totalVideos} vídeos`;
        }

        async function loadVideos(page) {
            page = page || 1;
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando...</div>';

            const search = document.getElementById('searchInput').value.trim();
            // Pagina��o no frontend para evitar buracos dos Arquivados
            let url = `/videos?page=1&limit=2000`;
            if (currentCategory) url += "&category=" + encodeURIComponent(currentCategory);
            if (search)          url += "&search="   + encodeURIComponent(search);

            try {
                const result = await apiGet(url);
                let allVideos = result.data || result;
                
                // Filtra os arquivados se n�o for uma busca espec�fica pela categoria Arquivados
                if (currentCategory !== "Arquivados") {
                    allVideos = allVideos.filter(v => v.category !== "Arquivados");
                }
                
                totalVideos = allVideos.length;
                totalPages  = Math.ceil(totalVideos / VIDEOS_PER_PAGE);
                currentPage = page;
                if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
                
                const start = (currentPage - 1) * VIDEOS_PER_PAGE;
                const end = start + VIDEOS_PER_PAGE;
                const paginatedVideos = allVideos.slice(start, end);

                renderVideos(paginatedVideos);
                renderPagination();
            } catch (error) {
                console.error(error);
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Erro ao carregar vídeos.</p>
                    </div>`;
            }
        }

        // ── Init ─────────────────────────────────────────────────
        currentCategory = getCategoryFromUrl();

        const titleEl = document.getElementById('categoryTitle');
        const descEl  = document.getElementById('categoryDesc');

        if (currentCategory) {
            titleEl.innerHTML = `<i class="fas fa-tag"></i> ${escapeHtml(currentCategory)}`;
            descEl.textContent = 'Vídeos da categoria ' + currentCategory;
            document.title = currentCategory + ' — Central de Conteúdos - SGP';
        } else {
            titleEl.innerHTML = '<i class="fas fa-tag"></i> Todos os vídeos';
            descEl.textContent = 'Navegue por todos os vídeos';
            document.title = 'Todos os vídeos — Central de Conteúdos - SGP';
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadVideos(1), 400);
        });

        loadVideos(1);
    })();
    </script>
</body>
</html>
