<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vídeos — SGP Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        .category-banner {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 2rem;
        }

        .category-banner h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a2332;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .category-banner h2 i { color: #e8590c; }
        .category-banner p { color: #5a6b85; margin-top: 0.2rem; }

        .search-section-inline {
            max-width: 1400px;
            margin: 0.8rem auto 0;
            padding: 0 2rem;
        }

        .search-wrapper-inline {
            background: #fff;
            border-radius: 14px;
            padding: 0.4rem 1rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #e8edf4;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .search-wrapper-inline i { color: #8a9bb5; }

        .search-wrapper-inline input {
            flex: 1;
            padding: 0.6rem 0;
            border: none;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: #1a2332;
            padding-left: 0;
        }

        .search-wrapper-inline input:focus { outline: none; }

        .videos-container {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 2rem 2rem;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.2rem;
        }

        @media (max-width: 768px) {
            .category-banner { padding: 0 1rem; }
            .category-banner h2 { font-size: 1.4rem; }
            .search-section-inline { padding: 0 1rem; }
            .videos-container { padding: 0 1rem 1rem; }
            .videos-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="hero-compact">
        <a href="index_roblox.html" class="logo-area">
            <div class="logo-icon sm">
                <i class="fas fa-play"></i>
            </div>
            <span class="logo-text-sm">SGP <span>Library</span></span>
        </a>
        <button class="btn-ghost" onclick="history.length > 1 ? history.back() : window.location.href='index_roblox.html'">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>
    </header>

    <!-- BANNER -->
    <div class="category-banner">
        <h2 id="categoryTitle"><i class="fas fa-tag"></i> Carregando...</h2>
        <p id="categoryDesc">Vídeos desta categoria</p>
    </div>

    <!-- SEARCH -->
    <div class="search-section-inline">
        <div class="search-wrapper-inline">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar nesta categoria..." autocomplete="off">
        </div>
    </div>

    <!-- GRID -->
    <div class="videos-container">
        <div id="videosGrid" class="videos-grid">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando vídeos...</div>
        </div>
    </div>

    <!-- PAGINATION -->
    <div class="pagination-wrapper">
        <div id="paginationContainer"></div>
        <div id="paginationInfo" class="pagination-info"></div>
    </div>

    <script src="js/utils.js"></script>
    <script>
    (function() {
        const { escapeHtml, buildThumbnailHtml, buildPagination, apiGet } = LoomLib;

        const VIDEOS_PER_PAGE = 12;
        let currentPage     = 1;
        let totalPages      = 1;
        let totalVideos     = 0;
        let currentCategory = '';

        function getCategoryFromUrl() {
            return new URLSearchParams(window.location.search).get('tag') || '';
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videosGrid');

            if (!videos || videos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-video"></i>
                        <p>Nenhum vídeo encontrado.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = '';
            for (const v of videos) {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.setAttribute('data-id', v.id);
                card.innerHTML = buildThumbnailHtml(v.link) + `
                    <div class="card-content">
                        <div class="video-title">${escapeHtml(v.title)}</div>
                        <div class="subcat"><i class="fas fa-tag"></i> ${escapeHtml(v.subcategory)}</div>
                        <div class="description">${escapeHtml(v.description || '')}</div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = 'player.html?id=' + encodeURIComponent(v.id);
                });
                grid.appendChild(card);
            }
        }

        function renderPagination() {
            const container = document.getElementById('paginationContainer');
            const info      = document.getElementById('paginationInfo');

            if (totalPages <= 1) {
                container.innerHTML = '';
                info.textContent = totalVideos + ' vídeo' + (totalVideos !== 1 ? 's' : '');
                return;
            }

            container.innerHTML = '';
            container.appendChild(buildPagination(currentPage, totalPages, (page) => {
                loadVideos(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }));
            info.textContent = `Página ${currentPage} de ${totalPages} • ${totalVideos} vídeos`;
        }

        async function loadVideos(page) {
            page = page || 1;
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando...</div>';

            const search = document.getElementById('searchInput').value.trim();
            let url = `/videos?page=${page}&limit=${VIDEOS_PER_PAGE}`;
            if (currentCategory) url += '&category=' + encodeURIComponent(currentCategory);
            if (search)          url += '&search='   + encodeURIComponent(search);

            try {
                const result    = await apiGet(url);
                const videos    = result.data || result;
                totalVideos = result.total      || videos.length;
                totalPages  = result.totalPages || Math.ceil(totalVideos / VIDEOS_PER_PAGE);
                currentPage = page;
                renderVideos(videos);
                renderPagination();
            } catch (error) {
                console.error(error);
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Erro ao carregar vídeos.</p>
                    </div>`;
            }
        }

        // ── Init ─────────────────────────────────────────────────
        currentCategory = getCategoryFromUrl();

        const titleEl = document.getElementById('categoryTitle');
        const descEl  = document.getElementById('categoryDesc');

        if (currentCategory) {
            titleEl.innerHTML = `<i class="fas fa-tag"></i> ${escapeHtml(currentCategory)}`;
            descEl.textContent = 'Vídeos da categoria ' + currentCategory;
            document.title = currentCategory + ' — SGP Library';
        } else {
            titleEl.innerHTML = '<i class="fas fa-tag"></i> Todos os vídeos';
            descEl.textContent = 'Navegue por todos os vídeos';
            document.title = 'Todos os vídeos — SGP Library';
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadVideos(1), 400);
        });

        loadVideos(1);
    })();
    </script>
</body>
</html>
