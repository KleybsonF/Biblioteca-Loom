<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SGP Library — Central de Vídeos</title>
    <meta name="description" content="Biblioteca de vídeos tutoriais do SGP, organizada por categorias e subcategorias.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
</head>
<body>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-top">
                <div class="logo-area">
                    <div class="logo-icon">
                        <i class="fas fa-play"></i>
                    </div>
                    <div class="logo-text">
                        <h1>SGP <span>Library</span></h1>
                        <p>Biblioteca de vídeos SGP</p>
                    </div>
                </div>
            </div>

            <div class="hero-title">
                <h2><i class="fas fa-play-circle"></i> Central de Vídeos do SGP</h2>
                <p>Encontre tutoriais e materiais de apoio organizados por categoria</p>
            </div>
        </div>
    </section>

    <!-- SEARCH -->
    <div class="search-section">
        <div class="search-wrapper">
            <div class="search-input-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por título ou descrição..." autocomplete="off">
            </div>
            <div class="filter-group">
                <select id="filterCategory" class="filter-select">
                    <option value="all">Todas categorias</option>
                </select>
                <select id="filterSubcategory" class="filter-select" disabled>
                    <option value="all">Primeiro selecione uma categoria</option>
                </select>
                <button id="btnClearFilters" class="btn-clear-filters hidden">
                    <i class="fas fa-times"></i> Limpar filtros
                </button>
            </div>
        </div>
    </div>

    <!-- VIDEOS -->
    <div class="videos-container">
        <div class="section-header">
            <h3><i class="fas fa-video"></i> Vídeos Disponíveis</h3>
            <span id="videoCount">Carregando...</span>
        </div>
        <div id="videosGridContainer" class="videos-grid">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando vídeos...</div>
        </div>
    </div>

    <!-- PAGINATION -->
    <div class="pagination-wrapper">
        <div id="paginationContainer"></div>
        <div id="paginationInfo" class="pagination-info"></div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <i class="fas fa-play-circle"></i> SGP Library &bull; Vídeos organizados por categoria
    </div>

    <script src="js/utils.js"></script>
    <script>
    (function() {
        const { escapeHtml, buildThumbnailHtml, buildPagination, apiGet, fetchCategories } = LoomLib;

        const VIDEOS_PER_PAGE = 9;
        let currentPage  = 1;
        let totalPages   = 1;
        let totalVideos  = 0;
        let categoriesMap = {};

        async function initCategories() {
            try {
                const data = await fetchCategories();
                const catSelect = document.getElementById('filterCategory');
                catSelect.innerHTML = '<option value="all">Todas categorias</option>';
                for (const item of data) {
                    categoriesMap[item.category] = item.subcategories;
                    const opt = document.createElement('option');
                    opt.value = item.category;
                    opt.textContent = item.category;
                    catSelect.appendChild(opt);
                }
            } catch (e) {
                console.warn('Não foi possível carregar categorias:', e);
            }
        }

        function updateSubcategoryFilter(category) {
            const subSelect = document.getElementById('filterSubcategory');
            if (!category || category === 'all') {
                subSelect.disabled = true;
                subSelect.innerHTML = '<option value="all">Primeiro selecione uma categoria</option>';
                return;
            }
            const subs = categoriesMap[category] || [];
            if (subs.length > 0) {
                subSelect.disabled = false;
                subSelect.innerHTML = '<option value="all">Todas subcategorias</option>';
                subs.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s; opt.textContent = s;
                    subSelect.appendChild(opt);
                });
            } else {
                subSelect.disabled = true;
                subSelect.innerHTML = '<option value="all">Nenhuma subcategoria disponível</option>';
            }
        }

        function updateClearButton() {
            const btn    = document.getElementById('btnClearFilters');
            const search = document.getElementById('searchInput').value;
            const cat    = document.getElementById('filterCategory').value;
            const sub    = document.getElementById('filterSubcategory').value;
            btn.classList.toggle('hidden', !(search || cat !== 'all' || sub !== 'all'));
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterCategory').value = 'all';
            updateSubcategoryFilter('all');
            updateClearButton();
            loadVideos(1);
        }

        function renderVideos(videos) {
            const grid      = document.getElementById('videosGridContainer');
            const countSpan = document.getElementById('videoCount');

            if (!videos || videos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-video"></i>
                        <p>Nenhum vídeo encontrado com esses filtros.</p>
                        <p style="margin-top:0.5rem;font-size:0.85rem;">
                            <a href="#" id="emptyStateClear">Limpar filtros</a>
                        </p>
                    </div>`;
                grid.querySelector('#emptyStateClear')?.addEventListener('click', (e) => {
                    e.preventDefault(); clearFilters();
                });
                countSpan.textContent = '0 vídeos';
                return;
            }

            countSpan.textContent = totalVideos + ' vídeo' + (totalVideos !== 1 ? 's' : '');
            grid.innerHTML = '';

            for (const video of videos) {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.setAttribute('data-id', video.id);
                card.innerHTML = buildThumbnailHtml(video.link) + `
                    <div class="card-content">
                        <div class="card-header">
                            <span class="video-title">${escapeHtml(video.title)}</span>
                            <span class="badge-cat">${escapeHtml(video.category)}</span>
                        </div>
                        <div class="subcat"><i class="fas fa-tag"></i> ${escapeHtml(video.subcategory)}</div>
                        <div class="description">${escapeHtml(video.description || 'Sem descrição adicional')}</div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = 'player.html?id=' + encodeURIComponent(video.id);
                });
                grid.appendChild(card);
            }
        }

        function renderPagination() {
            const container = document.getElementById('paginationContainer');
            const info      = document.getElementById('paginationInfo');
            if (totalPages <= 1) { container.innerHTML = ''; info.textContent = ''; return; }
            container.innerHTML = '';
            container.appendChild(buildPagination(currentPage, totalPages, (page) => {
                loadVideos(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }));
            const start = (currentPage - 1) * VIDEOS_PER_PAGE + 1;
            const end   = Math.min(currentPage * VIDEOS_PER_PAGE, totalVideos);
            info.textContent = `Mostrando ${start}–${end} de ${totalVideos} vídeos`;
        }

        async function loadVideos(page) {
            page = page || 1;
            const grid = document.getElementById('videosGridContainer');
            grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando vídeos...</div>';

            const search = document.getElementById('searchInput').value.trim();
            const cat    = document.getElementById('filterCategory').value;
            const sub    = document.getElementById('filterSubcategory').value;

            let url = `/videos?page=${page}&limit=${VIDEOS_PER_PAGE}`;
            if (search)        url += '&search='      + encodeURIComponent(search);
            if (cat !== 'all') url += '&category='    + encodeURIComponent(cat);
            if (sub !== 'all') url += '&subcategory=' + encodeURIComponent(sub);

            document.title = (cat !== 'all' ? cat + ' — ' : '') + 'SGP Library';

            try {
                const result    = await apiGet(url);
                const videosData = result.data || result;
                totalVideos = result.total      || videosData.length;
                totalPages  = result.totalPages || Math.ceil(totalVideos / VIDEOS_PER_PAGE);
                currentPage = page;
                renderVideos(videosData);
                renderPagination();
                updateClearButton();
                window.location.hash = 'page=' + page;
            } catch (error) {
                console.error(error);
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Erro ao conectar com o servidor.</p>
                        <p style="font-size:0.85rem;margin-top:0.5rem;">
                            O servidor pode estar iniciando. <a href="#" id="retryBtn">Tentar novamente</a>.
                        </p>
                    </div>`;
                document.getElementById('retryBtn')?.addEventListener('click', (e) => {
                    e.preventDefault(); loadVideos(page);
                });
            }
        }

        function handleHash() {
            const match = window.location.hash.match(/page=(\d+)/);
            const page  = match ? parseInt(match[1]) : 1;
            if (page !== currentPage) loadVideos(page);
        }

        document.getElementById('filterCategory').addEventListener('change', function() {
            updateSubcategoryFilter(this.value); loadVideos(1);
        });
        document.getElementById('filterSubcategory').addEventListener('change', () => loadVideos(1));
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadVideos(1), 500);
        });
        document.getElementById('btnClearFilters').addEventListener('click', clearFilters);
        window.addEventListener('hashchange', handleHash);

        initCategories().then(() => loadVideos(1));
    })();
    </script>
</body>
</html>
