<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Assistir Vídeo — SGP Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        /* ── Player layout ── */
        .player-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
        }

        .player-main { min-width: 0; }

        .player-wrapper {
            background: #0a1628;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            border: 1px solid #e8edf4;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .loading-state {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: #8a9bb5;
        }

        .loading-state i { font-size: 2rem; color: #e8590c; }

        /* ── Video info ── */
        .video-info {
            background: #fff;
            border-radius: 16px;
            margin-top: 1rem;
            border: 1px solid #e8edf4;
            padding: 1.2rem 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .video-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1a2332;
        }

        .video-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            color: #5a6b85;
            font-size: 0.85rem;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 0.8rem;
        }

        .video-meta .badge {
            background: #f0f2f5;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            color: #e8590c;
            font-weight: 600;
            font-size: 0.7rem;
        }

        .video-meta .subcat-badge {
            background: #f0f2f5;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            color: #5a6b85;
            font-weight: 500;
            font-size: 0.7rem;
        }

        .video-meta .date { color: #8a9bb5; font-size: 0.75rem; }

        .video-description {
            margin-top: 1rem;
            background: #f8fafc;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            color: #2c3a50;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #f0f2f5;
        }

        .video-description.empty { color: #8a9bb5; font-style: italic; }

        /* ── Sidebar ── */
        .player-sidebar { min-width: 0; }

        .player-sidebar h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1a2332;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .player-sidebar h3 i { color: #e8590c; }

        .suggestions-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .suggestion-item {
            display: flex;
            gap: 0.8rem;
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.5rem;
            border: 1px solid #e8edf4;
        }

        .suggestion-item:hover {
            background: #f8fafc;
            transform: scale(1.02);
            border-color: #e8590c;
            box-shadow: 0 4px 16px rgba(232, 89, 12, 0.12);
        }

        .suggestion-item.active {
            background: #fef0e8;
            border: 1px solid #e8590c;
            cursor: default;
        }

        /* Thumbnail na sidebar — menor */
        .suggestion-item .video-thumbnail {
            width: 120px;
            min-height: 67px;
            flex-shrink: 0;
            border-radius: 8px;
        }

        .suggestion-info {
            flex: 1;
            padding: 0.2rem 0.2rem 0.2rem 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .suggestion-info .title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a2332;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .suggestion-info .meta {
            font-size: 0.7rem;
            color: #8a9bb5;
            margin-top: 0.3rem;
        }

        .previous-tag {
            font-size: 0.6rem;
            background: #e8590c;
            color: #fff;
            padding: 0.05rem 0.5rem;
            border-radius: 50px;
            display: inline-block;
            margin-left: 0.3rem;
        }

        /* ── Responsive ── */
        @media (max-width: 1024px) {
            .player-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            .player-sidebar { margin-top: 1rem; }
            .suggestions-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 600px) {
            .hero-compact { flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem 1rem; }
            .logo-text-sm { font-size: 0.9rem; }
            .btn-back { font-size: 0.75rem; padding: 0.4rem 0.8rem; }
            .video-info h1 { font-size: 1.1rem; }
            .suggestion-item .video-thumbnail { width: 90px; min-height: 50px; }
            .suggestions-list { grid-template-columns: 1fr; }
            .player-container { padding: 0.5rem; }
            .video-info { padding: 1rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="hero-compact">
        <a href="index_roblox.html" class="logo-area">
            <div class="logo-icon sm">
                <i class="fas fa-play"></i>
            </div>
            <span class="logo-text-sm">SGP <span>Library</span></span>
        </a>
        <button class="btn-back" onclick="history.length > 1 ? history.back() : window.location.href='index_roblox.html'">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>
    </header>

    <!-- CONTEÚDO -->
    <div class="player-container" id="playerContainer">
        <div class="player-main">
            <div class="player-wrapper" id="playerWrapper">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-pulse"></i>
                    <p>Carregando vídeo...</p>
                </div>
            </div>

            <div class="video-info">
                <h1 id="videoTitle">Carregando...</h1>
                <div class="video-meta">
                    <span class="badge"    id="videoCategory">Categoria</span>
                    <span class="subcat-badge" id="videoSubcategory">Subcategoria</span>
                    <span class="date"     id="videoDate"></span>
                </div>
                <div class="video-description" id="videoDescription">Carregando descrição...</div>
            </div>
        </div>

        <div class="player-sidebar">
            <h3><i class="fas fa-lightbulb"></i> Vídeos Relacionados</h3>
            <div class="suggestions-list" id="suggestionsList">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-pulse"></i>
                    <p>Carregando sugestões...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
    (function() {
        const { escapeHtml, getLoomEmbedUrl, buildThumbnailHtml, formatDate, apiGet } = LoomLib;

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        // ── Renderiza o player principal ────────────────────────
        function renderMainVideo(video) {
            const wrapper     = document.getElementById('playerWrapper');
            const titleEl     = document.getElementById('videoTitle');
            const categoryEl  = document.getElementById('videoCategory');
            const subcatEl    = document.getElementById('videoSubcategory');
            const descEl      = document.getElementById('videoDescription');
            const dateEl      = document.getElementById('videoDate');

            const iframe = document.createElement('iframe');
            iframe.src  = getLoomEmbedUrl(video.link);
            iframe.allow = 'fullscreen';
            iframe.allowFullscreen = true;
            iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;';
            wrapper.innerHTML = '';
            wrapper.appendChild(iframe);

            titleEl.textContent    = video.title      || 'Sem título';
            categoryEl.textContent = video.category   || 'Sem categoria';
            subcatEl.textContent   = video.subcategory|| 'Sem subcategoria';
            dateEl.textContent     = formatDate(video.created_at || video.createdAt);

            if (video.description && video.description.trim()) {
                descEl.textContent = video.description;
                descEl.classList.remove('empty');
            } else {
                descEl.textContent = 'Nenhuma descrição fornecida para este vídeo.';
                descEl.classList.add('empty');
            }

            document.title = (video.title || 'Vídeo') + ' — SGP Library';
        }

        // ── Renderiza sidebar de sugestões ───────────────────────
        function renderSuggestions(videos, currentId, previousId) {
            const list = document.getElementById('suggestionsList');

            if (!videos || videos.length === 0) {
                list.innerHTML = `
                    <div class="empty-state" style="border:none;padding:2rem 1rem;">
                        <i class="fas fa-video"></i>
                        <p>Nenhum vídeo relacionado encontrado.</p>
                    </div>`;
                return;
            }

            list.innerHTML = '';
            for (const video of videos) {
                const isActive   = video.id === currentId;
                const isPrevious = previousId && video.id === previousId;

                const item = document.createElement('div');
                item.className = 'suggestion-item' + (isActive ? ' active' : '');
                item.setAttribute('data-id', video.id);
                item.innerHTML = buildThumbnailHtml(video.link) + `
                    <div class="suggestion-info">
                        <div class="title">
                            ${escapeHtml(video.title)}
                            ${isPrevious ? '<span class="previous-tag">← Anterior</span>' : ''}
                        </div>
                        <div class="meta">
                            ${escapeHtml(video.category)} &bull; ${escapeHtml(video.subcategory)}
                        </div>
                    </div>
                `;

                if (!isActive) {
                    item.addEventListener('click', () => {
                        const from = getParam('id');
                        window.location.href = 'player.html?id=' + encodeURIComponent(video.id)
                            + (from ? '&previous=' + encodeURIComponent(from) : '');
                    });
                }

                list.appendChild(item);
            }
        }

        // ── Carrega vídeo e relacionados ─────────────────────────
        async function loadPlayer() {
            const videoId    = getParam('id');
            const previousId = getParam('previous');

            if (!videoId) {
                document.getElementById('playerWrapper').innerHTML = `
                    <div class="empty-state" style="padding:4rem 1rem;text-align:center;background:transparent;border:none;">
                        <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#e53e3e;display:block;margin-bottom:1rem;"></i>
                        <p style="color:#1a2332;">Nenhum vídeo selecionado.</p>
                        <a href="index_roblox.html" style="color:#e8590c;font-weight:600;">Voltar para a biblioteca</a>
                    </div>`;
                document.getElementById('videoTitle').textContent = 'Vídeo não selecionado';
                document.getElementById('suggestionsList').innerHTML = '';
                return;
            }

            try {
                // Busca vídeo individual e relacionados em paralelo
                const [video, related] = await Promise.all([
                    apiGet('/videos/' + encodeURIComponent(videoId)),
                    apiGet('/videos/' + encodeURIComponent(videoId) + '/related?limit=10')
                        .catch(() => [])
                ]);

                renderMainVideo(video);
                renderSuggestions(related, videoId, previousId);

            } catch (error) {
                console.error('Erro ao carregar player:', error);
                document.getElementById('playerWrapper').innerHTML = `
                    <div class="empty-state" style="padding:4rem 1rem;text-align:center;background:transparent;border:none;">
                        <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#e53e3e;display:block;margin-bottom:1rem;"></i>
                        <p style="color:#1a2332;">Vídeo não encontrado ou erro ao carregar.</p>
                        <a href="index_roblox.html" style="color:#e8590c;font-weight:600;">Voltar para a biblioteca</a>
                    </div>`;
                document.getElementById('videoTitle').textContent = 'Erro ao carregar';
            }
        }

        loadPlayer();
    })();
    </script>
</body>
</html>
