<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Assistir Vídeo - SGP Loom Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #1a2332;
            line-height: 1.6;
        }

        /* HEADER - ESTILO SGP */
        .player-header {
            background: #171a22;
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid #e8590c;
        }

        .player-header .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .player-header .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #e8590c, #aa502a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(232, 89, 12, 0.3);
        }

        .player-header .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }

        .player-header .logo-text span {
            color: #e8590c;
        }

        .btn-back {
            background: linear-gradient(135deg, #e8590c, #aa502a);
            color: #fff;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(232, 89, 12, 0.3);
            font-family: 'Inter', sans-serif;
        }

        .btn-back:hover {
            transform: translateX(-2px);
            box-shadow: 0 6px 20px rgba(232, 89, 12, 0.4);
        }

        /* CONTEÚDO */
        .player-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
        }

        .player-main {
            min-width: 0;
        }

        .player-wrapper {
            background: #0a1628;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
            border: 1px solid #e8edf4;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            background: #fff;
            border-radius: 16px;
            margin-top: 1rem;
            border: 1px solid #e8edf4;
            padding: 1.2rem 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .video-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1a2332;
        }

        .video-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            color: #5a6b85;
            font-size: 0.85rem;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 0.8rem;
        }

        .video-meta .badge {
            background: #f0f2f5;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            color: #e8590c;
            font-weight: 600;
            font-size: 0.7rem;
        }

        .video-meta .subcat-badge {
            background: #f0f2f5;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            color: #5a6b85;
            font-weight: 500;
            font-size: 0.7rem;
        }

        .video-meta .date {
            color: #8a9bb5;
            font-size: 0.75rem;
        }

        .video-description {
            margin-top: 1rem;
            background: #f8fafc;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            color: #2c3a50;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #f0f2f5;
        }

        .video-description.empty {
            color: #8a9bb5;
            font-style: italic;
        }

        /* SIDEBAR */
        .player-sidebar {
            min-width: 0;
        }

        .player-sidebar h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1a2332;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .player-sidebar h3 i {
            color: #e8590c;
        }

        .suggestions-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .suggestion-item {
            display: flex;
            gap: 0.8rem;
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.5rem;
            border: 1px solid #e8edf4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .suggestion-item:hover {
            background: #f8fafc;
            transform: scale(1.02);
            border-color: #e8590c;
            box-shadow: 0 4px 16px rgba(232, 89, 12, 0.12);
        }

        .suggestion-thumbnail {
            width: 168px;
            min-height: 94px;
            background: #0a1628;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a6b85;
            font-size: 2rem;
        }

        .suggestion-thumbnail i {
            opacity: 0.4;
        }

        .suggestion-info {
            flex: 1;
            padding: 0.2rem 0.2rem 0.2rem 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .suggestion-info .title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a2332;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .suggestion-info .meta {
            font-size: 0.7rem;
            color: #8a9bb5;
            margin-top: 0.2rem;
        }

        .suggestion-info .meta span {
            display: inline-block;
            margin-right: 0.3rem;
        }

        .suggestion-item.active {
            background: #fef0e8;
            border: 1px solid #e8590c;
            box-shadow: 0 4px 16px rgba(232, 89, 12, 0.1);
        }

        .suggestion-item .previous-tag {
            font-size: 0.6rem;
            background: #e8590c;
            color: #fff;
            padding: 0.05rem 0.5rem;
            border-radius: 50px;
            display: inline-block;
            margin-left: 0.3rem;
        }

        /* LOADING & EMPTY */
        .loading-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #8a9bb5;
        }

        .loading-state i {
            font-size: 2rem;
            margin-bottom: 1rem;
            display: block;
            color: #e8590c;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #8a9bb5;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e8edf4;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.4;
            color: #e8590c;
        }

        /* RESPONSIVO */
        @media (max-width: 1024px) {
            .player-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .player-sidebar {
                margin-top: 1rem;
            }

            .suggestions-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }

            .suggestion-item {
                padding: 0.5rem;
            }
        }

        @media (max-width: 600px) {
            .player-header {
                padding: 0.5rem 1rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .player-header .logo-text {
                font-size: 0.9rem;
            }

            .btn-back {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
            }

            .video-info h1 {
                font-size: 1.1rem;
            }

            .suggestion-thumbnail {
                width: 120px;
                min-height: 67px;
            }

            .suggestions-list {
                grid-template-columns: 1fr;
            }

            .player-container {
                padding: 0.5rem;
            }

            .video-info {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="player-header">
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <i class="fas fa-play"></i>
            </div>
            <span class="logo-text">SGP <span>Library</span></span>
        </a>
        <button class="btn-back" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>
    </header>

    <!-- CONTEÚDO -->
    <div class="player-container" id="playerContainer">
        <div class="player-main">
            <div class="player-wrapper" id="playerWrapper">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-pulse"></i>
                    <p>Carregando vídeo...</p>
                </div>
            </div>

            <div class="video-info">
                <h1 id="videoTitle">Carregando...</h1>
                <div class="video-meta">
                    <span class="badge" id="videoCategory">Categoria</span>
                    <span class="subcat-badge" id="videoSubcategory">Subcategoria</span>
                    <span class="date" id="videoDate"></span>
                </div>
                <div class="video-description" id="videoDescription">Carregando descrição...</div>
            </div>
        </div>

        <div class="player-sidebar">
            <h3><i class="fas fa-lightbulb"></i> Vídeos Relacionados</h3>
            <div class="suggestions-list" id="suggestionsList">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-pulse"></i>
                    <p>Carregando sugestões...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const API_URL = 'https://biblioteca-loom.onrender.com/api';
            const MAX_SUGGESTIONS = 10;

            function getLoomEmbedUrl(loomUrl) {
                if (!loomUrl) return '';
                var match = loomUrl.trim().match(/loom\.com\/share\/([a-zA-Z0-9_-]+)/);
                return match ? 'https://www.loom.com/embed/' + match[1] : loomUrl;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function formatDate(dateStr) {
                if (!dateStr) return '';
                var date = new Date(dateStr);
                return 'Adicionado em ' + date.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            }

            function getVideoIdFromUrl() {
                var params = new URLSearchParams(window.location.search);
                return params.get('id');
            }

            async function fetchAllVideos() {
                try {
                    var response = await fetch(API_URL + '/videos?page=1&limit=1000');
                    var result = await response.json();
                    return result.data || result;
                } catch (error) {
                    console.error('Erro ao buscar vídeos:', error);
                    return [];
                }
            }

            function getRelatedVideos(allVideos, currentVideo, previousVideoId) {
                var related = [];

                if (previousVideoId) {
                    var previous = allVideos.find(function(v) { return v.id === previousVideoId; });
                    if (previous && previous.id !== currentVideo.id) {
                        related.push(previous);
                    }
                }

                var sameCategory = allVideos.filter(function(v) {
                    if (v.id === currentVideo.id) return false;
                    if (previousVideoId && v.id === previousVideoId) return false;
                    return v.category === currentVideo.category;
                });

                sameCategory.sort(function(a, b) {
                    if (a.subcategory === currentVideo.subcategory && b.subcategory !== currentVideo.subcategory) {
                        return -1;
                    }
                    if (b.subcategory === currentVideo.subcategory && a.subcategory !== currentVideo.subcategory) {
                        return 1;
                    }
                    return 0;
                });

                related = related.concat(sameCategory);

                if (related.length < MAX_SUGGESTIONS) {
                    var moreFromCategory = allVideos.filter(function(v) {
                        if (v.id === currentVideo.id) return false;
                        if (related.some(function(r) { return r.id === v.id; })) return false;
                        return v.category === currentVideo.category;
                    });
                    related = related.concat(moreFromCategory);
                }

                var uniqueRelated = [];
                var seenIds = {};
                for (var i = 0; i < related.length; i++) {
                    var video = related[i];
                    if (!seenIds[video.id]) {
                        seenIds[video.id] = true;
                        uniqueRelated.push(video);
                    }
                    if (uniqueRelated.length >= MAX_SUGGESTIONS) break;
                }

                return uniqueRelated;
            }

            function renderMainVideo(video) {
                var wrapper = document.getElementById('playerWrapper');
                var title = document.getElementById('videoTitle');
                var category = document.getElementById('videoCategory');
                var subcategory = document.getElementById('videoSubcategory');
                var description = document.getElementById('videoDescription');
                var date = document.getElementById('videoDate');

                wrapper.innerHTML = '';

                var embedUrl = getLoomEmbedUrl(video.link);
                var iframe = document.createElement('iframe');
                iframe.src = embedUrl;
                iframe.allow = 'fullscreen';
                iframe.allowFullscreen = true;
                iframe.loading = 'lazy';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';

                wrapper.appendChild(iframe);

                title.textContent = video.title || 'Sem título';
                category.textContent = video.category || 'Sem categoria';
                subcategory.textContent = video.subcategory || 'Sem subcategoria';
                date.textContent = video.createdAt ? formatDate(video.createdAt) : '';

                if (video.description && video.description.trim() !== '') {
                    description.textContent = video.description;
                    description.classList.remove('empty');
                } else {
                    description.textContent = 'Nenhuma descrição fornecida para este vídeo.';
                    description.classList.add('empty');
                }

                document.title = video.title + ' - Loom Library';
            }

            function renderSuggestions(videos, currentVideoId, previousVideoId) {
                var list = document.getElementById('suggestionsList');

                if (!videos || videos.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-video"></i>
                            <p>Nenhum vídeo relacionado encontrado nesta categoria.</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = '';

                for (var i = 0; i < videos.length; i++) {
                    var video = videos[i];
                    var isActive = video.id === currentVideoId;
                    var isPrevious = previousVideoId && video.id === previousVideoId;

                    var item = document.createElement('div');
                    item.className = 'suggestion-item' + (isActive ? ' active' : '');
                    item.innerHTML = `
                        <div class="suggestion-thumbnail">
                            <i class="fas fa-play-circle"></i>
                        </div>
                        <div class="suggestion-info">
                            <div class="title">
                                ${escapeHtml(video.title)}
                                ${isPrevious ? '<span class="previous-tag">← Anterior</span>' : ''}
                            </div>
                            <div class="meta">
                                <span>${escapeHtml(video.category)}</span>
                                <span>•</span>
                                <span>${escapeHtml(video.subcategory)}</span>
                            </div>
                        </div>
                    `;

                    if (!isActive) {
                        item.addEventListener('click', function() {
                            var id = this.getAttribute('data-id');
                            var currentId = getVideoIdFromUrl();
                            window.location.href = 'player.html?id=' + encodeURIComponent(id) + '&previous=' + encodeURIComponent(currentId);
                        });
                    }

                    item.setAttribute('data-id', video.id);
                    list.appendChild(item);
                }
            }

            async function loadPlayer() {
                var videoId = getVideoIdFromUrl();
                var previousVideoId = new URLSearchParams(window.location.search).get('previous');

                if (!videoId) {
                    document.getElementById('playerWrapper').innerHTML = `
                        <div class="empty-state" style="padding:4rem 1rem; text-align:center; background:transparent; border:none;">
                            <i class="fas fa-exclamation-triangle" style="font-size:3rem; color:#e53e3e;"></i>
                            <p style="margin-top:1rem; color:#1a2332;">Nenhum vídeo selecionado.</p>
                            <a href="index.html" style="color:#e8590c; text-decoration:underline; font-weight:600;">Voltar para a biblioteca</a>
                        </div>
                    `;
                    document.getElementById('videoTitle').textContent = 'Vídeo não encontrado';
                    document.getElementById('suggestionsList').innerHTML = '';
                    return;
                }

                try {
                    var allVideos = await fetchAllVideos();
                    var currentVideo = allVideos.find(function(v) { return v.id === videoId; });

                    if (!currentVideo) {
                        document.getElementById('playerWrapper').innerHTML = `
                            <div class="empty-state" style="padding:4rem 1rem; text-align:center; background:transparent; border:none;">
                                <i class="fas fa-exclamation-triangle" style="font-size:3rem; color:#e53e3e;"></i>
                                <p style="margin-top:1rem; color:#1a2332;">Vídeo não encontrado.</p>
                                <a href="index.html" style="color:#e8590c; text-decoration:underline; font-weight:600;">Voltar para a biblioteca</a>
                            </div>
                        `;
                        return;
                    }

                    renderMainVideo(currentVideo);
                    var relatedVideos = getRelatedVideos(allVideos, currentVideo, previousVideoId);
                    renderSuggestions(relatedVideos, currentVideo.id, previousVideoId);

                } catch (error) {
                    console.error('Erro ao carregar player:', error);
                    document.getElementById('playerWrapper').innerHTML = `
                        <div class="empty-state" style="padding:4rem 1rem; text-align:center; background:transparent; border:none;">
                            <i class="fas fa-exclamation-triangle" style="font-size:3rem; color:#e53e3e;"></i>
                            <p style="margin-top:1rem; color:#1a2332;">Erro ao carregar o vídeo.</p>
                            <p style="color:#8a9bb5; font-size:0.9rem;">Tente novamente mais tarde.</p>
                        </div>
                    `;
                }
            }

            loadPlayer();
        })();
    </script>
</body>
</html>
