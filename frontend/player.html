    <style>
        /* ── Player layout ── */
        .player-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 2rem;
            align-items: start;
            flex: 1;
        }

        .player-main { min-width: 0; }

        .player-wrapper {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-base);
            position: relative;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .loading-state {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: var(--text-muted);
        }

        .loading-state i { font-size: 2.5rem; color: var(--color-brand); }

        /* ── Video info ── */
        .video-info {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            margin-top: 1.5rem;
            border: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow-base);
        }

        .video-info h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-main);
            font-family: var(--font-heading);
            line-height: 1.3;
        }

        .video-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .video-meta .badge {
            background: var(--color-brand-muted);
            padding: 0.3rem 1rem;
            border-radius: 50px;
            color: var(--color-brand);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(232, 100, 27, 0.3);
        }

        .video-meta .subcat-badge {
            background: var(--bg-surface-elevated);
            padding: 0.3rem 1rem;
            border-radius: 50px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.75rem;
            border: 1px solid var(--border-color);
        }

        .video-meta .date { color: var(--text-muted); font-size: 0.8rem; }

        .video-description {
            margin-top: 1.5rem;
            background: var(--bg-surface-elevated);
            padding: 1.2rem 1.5rem;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid var(--border-color);
        }

        .video-description.empty { color: var(--text-muted); font-style: italic; background: transparent; border: none; padding: 0; }

        /* ── Sidebar ── */
        .player-sidebar { min-width: 0; }

        .player-sidebar h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-heading);
        }

        .player-sidebar h3 i { color: var(--color-brand); }

        .suggestions-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .suggestion-item {
            display: flex;
            gap: 1rem;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0.6rem;
            border: 1px solid var(--border-color);
        }

        .suggestion-item:hover {
            background: var(--bg-surface-hover);
            transform: translateX(4px);
            border-color: var(--color-brand);
            box-shadow: 0 4px 15px rgba(232, 100, 27, 0.15);
        }

        .suggestion-item.active {
            background: var(--color-brand-muted);
            border: 1px solid var(--color-brand);
            cursor: default;
        }
        
        .suggestion-item.active:hover {
            transform: none;
            box-shadow: none;
        }

        /* Thumbnail na sidebar — menor */
        .suggestion-item .video-thumbnail {
            width: 140px;
            min-height: 78px;
            flex-shrink: 0;
            border-radius: 8px;
        }

        .suggestion-item .dynamic-thumb {
            padding: 0.5rem; /* Reduz o padding para caber o texto */
        }

        .suggestion-item .thumb-title {
            font-size: 0.75rem; /* Reduz o tamanho da fonte */
            line-height: 1.2;
            -webkit-line-clamp: 3;
        }

        .suggestion-item .play-overlay i {
            font-size: 1.5rem; /* Reduz o ícone de play */
        }

        .suggestion-item .thumb-logo-tsmx {
            display: none; /* Esconde logo nas sugestões pequenas */
        }

        .suggestion-item .thumb-title-container {
            padding-right: 25px;
        }

        .suggestion-item .thumb-deco-icon {
            width: 45px;
            height: 45px;
            right: -5px;
            bottom: -5px;
        }

        .suggestion-info {
            flex: 1;
            padding: 0.2rem 0.2rem 0.2rem 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .suggestion-info .title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            font-family: var(--font-heading);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
            transition: color 0.3s;
        }
        
        .suggestion-item:hover .suggestion-info .title {
            color: var(--color-brand);
        }

        .suggestion-info .meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        .previous-tag {
            font-size: 0.65rem;
            background: var(--color-brand);
            color: #fff;
            padding: 0.1rem 0.5rem;
            border-radius: 50px;
            display: inline-block;
            margin-left: 0.4rem;
            vertical-align: middle;
            font-family: var(--font-body);
        }

        /* ── Responsive ── */
        @media (max-width: 1024px) {
            .player-container {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }
            .player-sidebar { margin-top: 1rem; }
            .suggestions-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
        }

        @media (max-width: 600px) {
            .hero-compact { flex-wrap: wrap; gap: 0.5rem; padding: 1rem; }
            .video-info h1 { font-size: 1.4rem; }
            .suggestion-item .video-thumbnail { width: 100px; min-height: 56px; }
            .suggestions-list { grid-template-columns: 1fr; }
            .player-container { padding: 1rem; }
            .video-info { padding: 1.2rem; }
        }
    </style>

    <script>
    (function() {
        const { escapeHtml, getLoomEmbedUrl, buildThumbnailHtml, formatDate, apiGet } = LoomLib;

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        // ── Renderiza o player principal ────────────────────────
        function renderMainVideo(video) {
            const wrapper     = document.getElementById('playerWrapper');
            const titleEl     = document.getElementById('videoTitle');
            const categoryEl  = document.getElementById('videoCategory');
            const subcatEl    = document.getElementById('videoSubcategory');
            const descEl      = document.getElementById('videoDescription');
            const dateEl      = document.getElementById('videoDate');

            const iframe = document.createElement('iframe');
            iframe.src  = getLoomEmbedUrl(video.link);
            iframe.allow = 'fullscreen';
            iframe.allowFullscreen = true;
            iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;';
            wrapper.innerHTML = '';
            wrapper.appendChild(iframe);

            titleEl.textContent    = video.title      || 'Sem título';
            categoryEl.textContent = video.category   || 'Sem categoria';
            subcatEl.textContent   = video.subcategory|| 'Sem subcategoria';
            dateEl.textContent     = formatDate(video.created_at || video.createdAt);

            if (video.description && video.description.trim()) {
                descEl.textContent = video.description;
                descEl.classList.remove('empty');
            } else {
                descEl.textContent = 'Nenhuma descrição fornecida para este vídeo.';
                descEl.classList.add('empty');
            }

            document.title = (video.title || 'Vídeo') + ' — Central de Conteúdos - SGP';
        }

        // ── Renderiza sidebar de sugestões ───────────────────────
        function renderSuggestions(videos, currentId, previousId) {
            const list = document.getElementById('suggestionsList');

            if (!videos || videos.length === 0) {
                list.innerHTML = `
                    <div class="empty-state" style="border:none;padding:2rem 1rem;">
                        <i class="fas fa-video"></i>
                        <p>Nenhum vídeo relacionado encontrado.</p>
                    </div>`;
                return;
            }

            list.innerHTML = '';
            for (const video of videos) {
                const isActive   = video.id === currentId;
                const isPrevious = previousId && video.id === previousId;

                const item = document.createElement('div');
                item.className = 'suggestion-item' + (isActive ? ' active' : '');
                item.setAttribute('data-id', video.id);
                item.innerHTML = buildThumbnailHtml(video.link, video.title) + `
                    <div class="suggestion-info">
                        <div class="title">
                            ${escapeHtml(video.title)}
                            ${isPrevious ? '<span class="previous-tag">← Anterior</span>' : ''}
                        </div>
                        <div class="meta">
                            ${escapeHtml(video.category)} &bull; ${escapeHtml(video.subcategory)}
                        </div>
                    </div>
                `;

                if (!isActive) {
                    item.addEventListener('click', () => {
                        const from = getParam('id');
                        window.location.href = 'player.html?id=' + encodeURIComponent(video.id)
                            + (from ? '&previous=' + encodeURIComponent(from) : '');
                    });
                }

                list.appendChild(item);
            }
        }

        // ── Carrega vídeo e relacionados ─────────────────────────
        async function loadPlayer() {
            const videoId    = getParam('id');
            const previousId = getParam('previous');

            if (!videoId) {
                document.getElementById('playerWrapper').innerHTML = `
                    <div class="empty-state" style="padding:4rem 1rem;text-align:center;background:transparent;border:none;">
                        <i class="fas fa-exclamation-triangle" style="font-size:3.5rem;color:var(--color-brand);display:block;margin-bottom:1.5rem;"></i>
                        <p style="color:var(--text-main);font-size:1.1rem;">Nenhum vídeo selecionado.</p>
                        <a href="index.html" style="color:var(--color-brand);font-weight:600;margin-top:1rem;display:inline-block;">Voltar para a biblioteca</a>
                    </div>`;
                document.getElementById('videoTitle').textContent = 'Vídeo não selecionado';
                document.getElementById('suggestionsList').innerHTML = '';
                return;
            }

            try {
                // Busca vídeo individual e relacionados em paralelo
                const [video, related] = await Promise.all([
                    apiGet('/videos/' + encodeURIComponent(videoId)),
                    apiGet('/videos/' + encodeURIComponent(videoId) + '/related?limit=10')
                        .catch(() => [])
                ]);

                renderMainVideo(video);
                renderSuggestions(related, videoId, previousId);

            } catch (error) {
                console.error('Erro ao carregar player:', error);
                document.getElementById('playerWrapper').innerHTML = `
                    <div class="empty-state" style="padding:4rem 1rem;text-align:center;background:transparent;border:none;">
                        <i class="fas fa-exclamation-triangle" style="font-size:3.5rem;color:var(--color-brand);display:block;margin-bottom:1.5rem;"></i>
                        <p style="color:var(--text-main);font-size:1.1rem;">Vídeo não encontrado ou erro ao carregar.</p>
                        <a href="index.html" style="color:var(--color-brand);font-weight:600;margin-top:1rem;display:inline-block;">Voltar para a biblioteca</a>
                    </div>`;
                document.getElementById('videoTitle').textContent = 'Erro ao carregar';
            }
        }

        loadPlayer();
    })();
    </script>
</body>
</html>
